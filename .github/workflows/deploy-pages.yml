name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish ClickPrix/ClickPrix.csproj -c Release -o publish

      # The site is served at https://<user>.github.io/ClickPrix/, not /
      - name: Rewrite base href for project site
        run: sed -i 's|<base href="/" />|<base href="/ClickPrix/" />|' publish/wwwroot/index.html

      # Jekyll drops underscore-prefixed folders like _framework
      - name: Disable Jekyll
        run: touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
